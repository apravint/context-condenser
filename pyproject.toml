[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "context-condenser"
version = "0.1.0"
description = "Ultra-fast local BM25 context compression for AI coding agents. 0 LLM calls, 0 token costs."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    { name = "Ayyappa Pravin", email = "apravint@gmail.com" }
]
keywords = ["llm", "context-window", "compression", "bm25", "ai-agents", "claude-code", "cursor", "mcp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]

dependencies = []

[project.scripts]
context-condenser = "context_condenser.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/context_condenser"]
